  <!--
    Замени плейсхолдеры на свои фото: положи файлы в assets/photos/ (напр. moscow.jpg)
    и в каждом .masonry-item поменяй src на "assets/photos/твой-файл.jpg" и подпись в .photo-caption.
  -->
  <div class="masonry-grid">
    <div class="masonry-item"><img src="assets/photos/ph1.svg" alt="Фото" loading="lazy" /><div class="photo-caption">Замени на своё фото</div></div>

<div class="lightbox" id="lightbox">

  <img id="lightboxImg" src="" alt="" />
</div>

<script>
  (function(){
    var lb = document.getElementById('lightbox');
    var lbImg = document.getElementById('lightboxImg');
    document.querySelectorAll('.masonry-item img').forEach(function(img){
      img.parentElement.addEventListener('click', function(){
        lbImg.src = img.src; lbImg.alt = img.alt; lb.classList.add('active');
      });
    });
    function close(){ lb.classList.remove('active'); lbImg.src = ''; }
    document.getElementById('lightboxClose').addEventListener('click', close);
    lb.addEventListener('click', function(e){ if(e.target === lb) close(); });
    document.addEventListener('keydown', function(e){ if(e.key === 'Escape') close(); });
  })();
</script>
